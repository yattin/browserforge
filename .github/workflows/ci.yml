name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Static analysis and unit tests
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go vet ./...
          go test -v ./...
      - name: Build and self-test
        shell: pwsh
        run: |
          .\build.ps1 -Clean -SelfTest
